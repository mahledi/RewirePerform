name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      VITE_SUPABASE_PROJECT_ID: abcdefghijklmnopqrst
      VITE_APP_ENV: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-brand.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Install brand verification dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-brand.txt

      - name: Verify
        run: npm run ci
