<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1217" />
    <title>RewirePerform offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0b0f14;
        color: #eef1f4;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #0e1217 0%, #080b10 100%);
      }
      main {
        width: min(420px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px;
        padding: 24px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: rgba(238, 241, 244, 0.68);
        font-size: 14px;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gerade offline</h1>
      <p>RewirePerform konnte die aktuelle Version nicht laden. Bitte pruefe deine Verbindung und oeffne die App erneut.</p>
    </main>
  </body>
</html>
