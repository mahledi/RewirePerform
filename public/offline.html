<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0D0E12" />
    <title>RewirePerform offline</title>
    <style>
      :root {
        color-scheme: dark;
        background: #0d0e12;
        color: #eef0f2;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0d0e12;
      }
      main {
        box-sizing: border-box;
        width: min(420px, 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        padding: 24px;
        background: #15171c;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: rgba(238, 240, 242, 0.68);
        font-size: 14px;
        line-height: 1.55;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 28px;
        color: #eef0f2;
        font-size: 17px;
        font-weight: 700;
      }
      .brand img {
        display: block;
        width: 36px;
        height: 36px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/brand/rewireperform-symbol-dark.svg" alt="" width="36" height="36" />
        <span>RewirePerform</span>
      </div>
      <h1>Gerade offline</h1>
      <p>Die aktuelle Version konnte nicht geladen werden. Bitte prüfe deine Verbindung und öffne die App erneut.</p>
    </main>
  </body>
</html>
